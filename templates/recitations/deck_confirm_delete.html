{% extends 'base.html' %}

{% block title %}Delete Deck | recite ready{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="lu-card p-4 p-md-5 text-center">
                <div class="lu-square-tile mx-auto mb-3">
                    <i class="bi bi-trash3-fill"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2">Delete Question Deck?</h4>
                <p class="text-secondary small mb-4">
                    Permanently delete <strong>"{{ deck.title }}"</strong> and all <strong>{{ deck.question_count }} questions</strong> inside it?
                </p>

                <form method="post" class="d-grid gap-2">
                    {% csrf_token %}
                    <button type="submit" class="lu-btn-black py-2">Yes, Delete Deck</button>
                    <a href="{% url 'deck_detail' deck.id %}" class="lu-btn-outline text-decoration-none py-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
