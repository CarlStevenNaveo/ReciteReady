{% extends 'base.html' %}

{% block title %}Delete Question | recite ready{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="lu-card p-4 p-md-5 text-center">
                <div class="lu-square-tile mx-auto mb-3">
                    <i class="bi bi-trash3-fill"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2">Delete Question?</h4>
                <p class="text-secondary small mb-3">Remove this prompt from <strong>{{ deck.title }}</strong>?</p>

                <div class="lu-ink-card p-3 text-start mb-4">
                    <div class="small fw-semibold text-muted text-uppercase mb-1" style="font-size: 0.7rem;">Prompt</div>
                    <div class="small text-dark">{{ question.prompt }}</div>
                </div>

                <form method="post" class="d-grid gap-2">
                    {% csrf_token %}
                    <button type="submit" class="lu-btn-black py-2">Yes, Delete Question</button>
                    <a href="{% url 'deck_detail' deck.id %}" class="lu-btn-outline text-decoration-none py-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
