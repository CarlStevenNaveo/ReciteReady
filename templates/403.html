{% extends 'base.html' %}

{% block title %}Access Denied (403) | recite ready{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="lu-card p-5">
                <div class="lu-square-tile mx-auto mb-4">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h2 class="fw-bold text-dark mb-2">403 — Access Denied</h2>
                <p class="text-secondary small mb-4">
                    You do not have permission to access this portal. Role-based permissions are enforced to protect academic sessions.
                </p>
                <a href="{% url 'role_dashboard' %}" class="lu-btn-black lu-btn-chevron text-decoration-none px-4">
                    <span>Return to Dashboard</span>
                    <i class="bi bi-chevron-right"></i>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
